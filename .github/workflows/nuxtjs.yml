name: Deploy Nuxt site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PNPM (matches package.json#packageManager if you pinned it)
      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # Build for GitHub Pages with the correct base
      - name: Build (Nuxt 3, GitHub Pages preset)
        env:
          # If using a project page: https://<user>.github.io/<repo>/
          # This ensures assets load from /<repo>/_nuxt/*
          VITE_HF_API_KEY: ${{ secrets.HF_API_KEY }}
          NUXT_APP_BASE_URL: "/${{ github.event.repository.name }}/"
        run: pnpm exec nuxt build --preset github_pages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public


  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
