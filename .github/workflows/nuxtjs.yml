name: Deploy Nuxt site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install PNPM to PATH (must match package.json exactly)
      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.1
          run_install: false

      # Node (with pnpm cache)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # Sanity check: ensure pnpm is available
      - name: Verify pnpm
        run: |
          which pnpm
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: nuxt

      - name: Build static site
        run: pnpm run generate

      # 👇 Pick ONE based on your Nuxt version
      # Nuxt 3 default:
      - name: Upload artifact (Nuxt 3)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public

      # Nuxt 2:
      # - name: Upload artifact (Nuxt 2)
      #   uses: actions/upload-pages-artifact@v3
      #   with:
      #     path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
