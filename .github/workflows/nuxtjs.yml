name: Deploy Nuxt site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'   # still caches the PNPM store

      - name: Enable Corepack (uses package.json#packageManager)
        run: |
          corepack enable
          corepack install   # installs pnpm@<exact version from package.json>

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: nuxt

      - name: Generate static site
        run: pnpm run generate

      # Nuxt 3 -> .output/public ; Nuxt 2 -> dist
      - name: Upload artifact (Nuxt 3)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
