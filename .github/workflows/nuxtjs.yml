name: Deploy Nuxt site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install PNPM *before* using it
      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: nuxt

      - name: Generate static site
        run: pnpm run generate

      # 👇 Pick the right output dir depending on Nuxt version
      - name: Upload artifact (Nuxt 3)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public

      # - name: Upload artifact (Nuxt 2)
      #   uses: actions/upload-pages-artifact@v3
      #   with:
      #     path: ./dist

